<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Aperçus des supports de droit | Trajectoire Droit</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #0e2a47; background: #f1f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid #d9e3ed; }
    header a, main { display: block; width: min(800px, calc(100% - 24px)); margin: auto; }
    header a { padding-block: 12px; }
    header img { display: block; }
    main { padding-block: 24px 40px; }
    [hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(1.45rem, 4vw, 2.15rem); line-height: 1.18; }
    #niveau { margin: 8px 0 0; color: #4d5d71; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding-block: 16px; }
    .actions a, main > p a { color: #0e2a47; text-underline-offset: 3px; }
    #acheter { min-height: 44px; border: 0; border-radius: 6px; padding: 10px 15px; background: #0e2a47; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    #acheter:disabled { opacity: .66; cursor: wait; }
    #offre { margin-top: 16px; max-width: 68ch; line-height: 1.5; }
    #offre p { margin: 0; }
    #offre p + p { margin-top: 8px; }
    .actions--prix { display: grid; grid-template-columns: max-content minmax(0, 1fr); justify-items: start; gap: 12px; }
    .actions--prix > a, .actions--prix > .tjd-garantie, #apercuPrice[hidden] + #acheter { grid-column: 1 / -1; }
    .actions--prix > .tjd-garantie { margin: 0; }
    #apercuPrice { font-size: 1.2rem; font-weight: 700; white-space: nowrap; }
    a:focus-visible, button:focus-visible { outline: 2px solid #2878c2; outline-offset: 3px; }
    #pages img { display: block; width: 100%; height: auto; margin-bottom: 16px; border: 1px solid #d9e3ed; background: #fff; }
    .product-carousel__controls { display: none; }
    @media (max-width: 640px) {
      [data-carousel-ready] .product-carousel__controls {
        display: flex; align-items: center; justify-content: center; gap: 16px; margin: 0 0 10px;
      }
      [data-carousel-ready] #pages {
        display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
        margin-bottom: 16px;
      }
      [data-carousel-ready] #pages::-webkit-scrollbar { display: none; }
      [data-carousel-ready] #pages img { flex: 0 0 100%; scroll-snap-align: start; margin-bottom: 0; }
      .product-carousel__controls button {
        display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
        border: 1px solid #9aabbd; border-radius: 50%; color: #0e2a47; background: #fff; cursor: pointer;
      }
      .product-carousel__controls button[aria-disabled="true"] { opacity: .55; cursor: default; }
      .product-carousel__controls span { min-width: 6ch; text-align: center; font: 600 .875rem Arial, Helvetica, sans-serif; font-variant-numeric: tabular-nums; }
      #pages:focus-visible { outline: 2px solid #2878c2; outline-offset: 3px; }
    }
  </style>
</head>
<body>
  <header><a href="/"><img src="/assets/logo-tjd.svg" width="160" height="34" alt="Trajectoire Droit"></a></header>
  <main id="apercu" hidden>
    <h1 id="titre"></h1>
    <p id="niveau"></p>
    <div id="offre" hidden>
      <p id="contenu-offre"></p>
      <p id="exemple-offre"></p>
    </div>
    <div class="actions">
      <a id="pdf">Ouvrir l’aperçu en PDF</a>
      <span id="apercuPrice" hidden></span>
      <button type="button" id="acheter"></button>
    </div>
    <div id="lecteur-apercu">
      <div class="product-carousel__controls">
        <button type="button" data-carousel-prev aria-label="Page précédente" aria-controls="pages" aria-disabled="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
        </button>
        <span data-carousel-position role="status"></span>
        <button type="button" data-carousel-next aria-label="Page suivante" aria-controls="pages">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg>
        </button>
      </div>
      <div id="pages" class="product-carousel__viewport" role="region" aria-labelledby="titre" data-carousel-focus></div>
    </div>
  </main>
  <main id="catalogue">
    <h1>Choisis ton support de droit</h1>
    <p><a href="/formations.html">Voir les fiches et les recueils</a></p>
  </main>
  <script>
    (() => {
      const supports = {
        "fiche-constit-l1-s1": {
          "titre": "Aperçu de la fiche de droit constitutionnel",
          "niveau": "Licence 1, semestre 1",
          "achat": "Acheter la fiche complète",
          "contenu": "La fiche complète reprend le programme du semestre 1. Tu reçois aussi le plan détaillé et les cartes mentales.",
          "exemple": "Comment illustrer la séparation des pouvoirs dans une dissertation ? L’aperçu montre à quelles conditions le Congrès peut faire adopter un texte malgré le veto du président américain.",
          "pages": 1,
          "largeur": 1320,
          "hauteur": 1867
        },
        "maj-contrats-l2-s1": {
          "titre": "Aperçu des majeures de droit des contrats",
          "niveau": "Licence 2, semestre 1",
          "achat": "Acheter la compilation de majeures",
          "contenu": "La compilation réunit les majeures préparées du semestre 1. Chaque majeure présente les conditions d’application de la règle et ses exceptions. Tu reçois aussi le plan détaillé de la compilation.",
          "exemple": "L’acheteur aurait-il signé le contrat si le vendeur lui avait dit la vérité ? Dans l’aperçu, la majeure sur le dol montre comment vérifier ce point à partir des faits de l’énoncé.",
          "pages": 8,
          "largeur": 1320,
          "hauteur": 1867
        },
        "maj-da-l2-s1": {
          "titre": "Aperçu des majeures de droit administratif",
          "niveau": "Licence 2, semestre 1",
          "pages": 11,
          "largeur": 1320,
          "hauteur": 1867
        },
        "maj-travail-l3-s1": {
          "titre": "Aperçu des majeures de droit du travail",
          "niveau": "Licence 3, semestre 1",
          "pages": 6,
          "largeur": 1320,
          "hauteur": 1867
        },
        "maj-societes-l3-s1": {
          "titre": "Aperçu des majeures de droit des sociétés",
          "niveau": "Licence 3, semestre 1",
          "pages": 10,
          "largeur": 1320,
          "hauteur": 1867
        },
        "maj-contrats-speciaux-l3": {
          "titre": "Aperçu des majeures de contrats spéciaux",
          "niveau": "Licence 3, semestre 1",
          "pages": 8,
          "largeur": 1320,
          "hauteur": 1867
        }
      };
      const produit = new URLSearchParams(window.location.search).get('produit') || window.location.hash.slice(1);
      if (!Object.hasOwn(supports, produit)) return;

      // Stripe reprend le chemin et le fragment quand le lecteur revient à l’aperçu.
      if (window.location.hash !== '#' + produit) history.replaceState(null, '', '#' + produit);

      const { titre, niveau, achat, contenu, exemple, pages, largeur, hauteur } = supports[produit];
      document.title = titre + ' | Trajectoire Droit';
      document.getElementById('titre').textContent = titre;
      document.getElementById('niveau').textContent = niveau;
      document.getElementById('pdf').href = produit + '/apercu.pdf';

      const acheter = document.getElementById('acheter');
      acheter.dataset.tjdProduit = produit;
      acheter.textContent = achat || 'Acheter le recueil complet';

      if (achat) {
        document.getElementById('contenu-offre').textContent = contenu;
        document.getElementById('exemple-offre').textContent = exemple;
        document.getElementById('offre').hidden = false;
        acheter.parentElement.classList.add('actions--prix');

        const prix = document.getElementById('apercuPrice');
        fetch('/assets/panier-inclusions.json', { cache: 'no-store', credentials: 'omit' })
          .then((reponse) => reponse.ok ? reponse.json() : null)
          .then((catalogue) => {
            const centimes = catalogue?.prix?.[produit];
            if (!Number.isSafeInteger(centimes) || centimes <= 0) return;
            prix.textContent = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(centimes / 100);
            prix.hidden = false;
            acheter.setAttribute('aria-describedby', prix.id);
          })
          .catch(() => {
            // Stripe reste accessible si le catalogue public est indisponible.
          });
      }

      const images = document.getElementById('pages');
      for (let page = 1; page <= pages; page += 1) {
        const image = document.createElement('img');
        image.className = 'product-carousel__slide';
        image.src = produit + '/page-' + page + '.webp';
        image.alt = titre + ', page ' + page + ' sur ' + pages;
        image.width = largeur;
        image.height = hauteur;
        image.loading = page === 1 ? 'eager' : 'lazy';
        image.decoding = 'async';
        images.append(image);
      }
      if (pages > 1) document.getElementById('lecteur-apercu').setAttribute('data-product-carousel', '');
      document.getElementById('catalogue').hidden = true;
      document.getElementById('apercu').hidden = false;
    })();
  </script>
  <script src="/assets/js/apercu-pages.js?v=6c30d9a5" defer></script>
  <script src="/assets/js/achat.js?v=81a894f1" defer></script>
</body>
</html>
